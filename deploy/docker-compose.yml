services:
  catalog:
    image: catalog-app:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: catalog-app
    ports:
      - "8000:8000"
    volumes:
      - catalog-data:/data
    env_file:
      - ../.env
    restart: unless-stopped

volumes:
  catalog-data:
