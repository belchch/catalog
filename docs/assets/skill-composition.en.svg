<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="scTitle scDesc">
  <title id="scTitle">A skill as a session tool</title>
  <desc id="scDesc">A skill attached to a session can call another skill; nested calls are limited by depth, budget, and deadline.</desc>
  <defs>
    <filter id="scShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f2b46" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="24" fill="#fbfcfe" stroke="#e4e9f0"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="62" fill="#16324c" font-size="25" font-weight="650">Skills attach to chat and call each other</text>
    <text x="64" y="92" fill="#64748b" font-size="15.5">Each call is a separate run with a frozen configuration.</text>
    <g stroke="#9fb0c1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M312 212L320 220L312 228"/>
      <path d="M596 212L604 220L596 228"/>
      <path d="M880 212L888 220L880 228"/>
    </g>
    <g filter="url(#scShadow)">
      <g transform="translate(64 150)">
        <rect width="220" height="140" rx="16" fill="#ffffff" stroke="#e4e9f0"/>
        <rect x="16" y="16" width="44" height="44" rx="12" fill="#eaf4fc"/>
        <path d="M30 28h16c2.2 0 4 1.8 4 4v8c0 2.2-1.8 4-4 4h-7l-6 5v-5h-3c-2.2 0-4-1.8-4-4v-8c0-2.2 1.8-4 4-4z" fill="none" stroke="#1d83c4" stroke-width="2" stroke-linejoin="round"/>
        <text x="16" y="90" fill="#16324c" font-size="17" font-weight="650">Session</text>
        <text x="16" y="114" fill="#8b98a9" font-size="12.5">skills attached as tools</text>
      </g>
      <g transform="translate(348 150)">
        <rect width="220" height="140" rx="16" fill="#eaf4fc" stroke="#a8d2ee"/>
        <rect x="16" y="16" width="44" height="44" rx="12" fill="#1d83c4"/>
        <path d="M29 39l6 6 12-13" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="16" y="90" fill="#16324c" font-size="17" font-weight="700">Skill A</text>
        <text x="16" y="114" fill="#5b7590" font-size="12" font-family="'SF Mono', Consolas, monospace">pinned · 72ac91ef</text>
      </g>
      <g transform="translate(632 150)">
        <rect width="220" height="140" rx="16" fill="#ffffff" stroke="#cbbcf0"/>
        <rect x="16" y="16" width="44" height="44" rx="12" fill="#efeafb"/>
        <path d="M38 27v22M27 38h22" stroke="#6d4fc4" stroke-width="2.4" stroke-linecap="round"/>
        <text x="16" y="90" fill="#16324c" font-size="17" font-weight="650">Skill B</text>
        <text x="16" y="114" fill="#8b98a9" font-size="12.5">nested run</text>
      </g>
      <g transform="translate(916 150)">
        <rect width="220" height="140" rx="16" fill="#ffffff" stroke="#b2e2c5"/>
        <rect x="16" y="16" width="44" height="44" rx="12" fill="#e5f6ec"/>
        <path d="M28 39l7 7 14-15" fill="none" stroke="#2f855a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="16" y="90" fill="#16324c" font-size="17" font-weight="650">Result</text>
        <text x="16" y="114" fill="#8b98a9" font-size="12.5">visible in the shared trace</text>
      </g>
    </g>
    <g filter="url(#scShadow)">
      <rect x="64" y="322" width="1072" height="54" rx="14" fill="#ffffff" stroke="#e4e9f0"/>
    </g>
    <rect x="86" y="309" width="126" height="26" rx="13" fill="#ffffff" stroke="#e4e9f0"/>
    <text x="149" y="326.5" fill="#64748b" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1">CONSTRAINTS</text>
    <g fill="#3f556b" font-size="14.5">
      <text x="248" y="354">depth d 2</text>
      <text x="460" y="354">d 60 LLM calls</text>
      <text x="700" y="354">d 20 nested runs</text>
      <text x="985" y="354">deadline per turn</text>
    </g>
    <g stroke="#e4e9f0">
      <line x1="420" y1="336" x2="420" y2="362"/>
      <line x1="660" y1="336" x2="660" y2="362"/>
      <line x1="945" y1="336" x2="945" y2="362"/>
    </g>
  </g>
