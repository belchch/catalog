<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="vfTitle vfDesc">
  <title id="vfTitle">Result verification</title>
  <desc id="vfDesc">The result goes through deterministic and custom checks; on failure the run is repeated with the reason in context.</desc>
  <defs>
    <filter id="vfShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f2b46" flood-opacity="0.07"/>
    </filter>
    <marker id="vfArrowRed" markerWidth="9" markerHeight="9" refX="4.5" refY="6.5" orient="auto">
      <path d="M1 8L4.5 2L8 8" fill="none" stroke="#c86b5d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="#fbfcfe" stroke="#e4e9f0"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="62" fill="#16324c" font-size="25" font-weight="650">The result is checked separately from the model</text>
    <text x="64" y="92" fill="#64748b" font-size="15.5">Deterministic checks and the LLM judge are distinct, explicitly labelled types.</text>
    <g stroke="#9fb0c1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M353 237L361 245L353 253"/>
      <path d="M799 237L807 245L799 253"/>
    </g>
    <path d="M580 350V372Q580 388 564 388H190Q174 388 174 372V318" fill="none" stroke="#c86b5d" stroke-width="2" marker-end="url(#vfArrowRed)"/>
    <rect x="770" y="210" width="58" height="24" rx="12" fill="#e5f6ec"/>
    <text x="799" y="226.5" fill="#1f7a4d" text-anchor="middle" font-size="11" font-weight="700">PASS</text>
    <g filter="url(#vfShadow)">
      <g transform="translate(64 178)">
        <rect width="220" height="134" rx="16" fill="#ffffff" stroke="#e4e9f0"/>
        <rect x="16" y="16" width="44" height="44" rx="12" fill="#eaf4fc"/>
        <path d="M33 29l14 9-14 9z" fill="#1d83c4"/>
        <text x="16" y="90" fill="#16324c" font-size="17" font-weight="650">Execution</text>
        <text x="16" y="114" fill="#8b98a9" font-size="12.5">retried on failure</text>
      </g>
      <g transform="translate(430 140)">
        <rect width="300" height="210" rx="18" fill="#eaf4fc" stroke="#a8d2ee"/>
        <text x="24" y="40" fill="#16324c" font-size="18" font-weight="700">Verify</text>
        <text x="24" y="62" fill="#5b7590" font-size="12.5">checks after execution</text>
        <g transform="translate(22 78)">
          <rect width="256" height="34" rx="9" fill="#e5f6ec"/>
          <circle cx="18" cy="17" r="8" fill="#2f855a"/>
          <path d="M14.5 17l2.5 2.5 5-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="22" fill="#276749" font-size="13" font-family="'SF Mono', Consolas, monospace">non_empty</text>
        </g>
        <g transform="translate(22 120)">
          <rect width="256" height="34" rx="9" fill="#e5f6ec"/>
          <circle cx="18" cy="17" r="8" fill="#2f855a"/>
          <path d="M14.5 17l2.5 2.5 5-6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="34" y="22" fill="#276749" font-size="13" font-family="'SF Mono', Consolas, monospace">has_section</text>
        </g>
        <g transform="translate(22 162)">
          <rect width="256" height="34" rx="9" fill="#efeafb"/>
          <circle cx="18" cy="17" r="8" fill="#6d4fc4"/>
          <text x="18" y="20.5" fill="#ffffff" text-anchor="middle" font-size="9" font-weight="700">AI</text>
          <text x="34" y="22" fill="#5b3fa8" font-size="13" font-family="'SF Mono', Consolas, monospace">custom &#183; LLM judge</text>
        </g>
      </g>
      <g transform="translate(876 178)">
        <rect width="260" height="134" rx="16" fill="#ffffff" stroke="#b2e2c5"/>
        <rect x="16" y="16" width="44" height="44" rx="12" fill="#e5f6ec"/>
        <path d="M28 39l7 7 14-15" fill="none" stroke="#2f855a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="16" y="90" fill="#16324c" font-size="17" font-weight="650">Result</text>
        <text x="16" y="114" fill="#8b98a9" font-size="12.5">all checks passed</text>
      </g>
    </g>
    <rect x="302" y="376" width="150" height="25" rx="12.5" fill="#fdecea"/>
    <text x="377" y="393" fill="#a63d2e" text-anchor="middle" font-size="11.5" font-weight="700">FAIL &#183; reason in context</text>
  </g>
</svg>
