<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="trTitle trDesc">
  <title id="trTitle">System tool registry</title>
  <desc id="trDesc">The registry holds the app capabilities, allowed_tools grants a skill a subset, an unknown tool is rejected before the model is called.</desc>
  <defs>
    <filter id="trShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f2b46" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="489" rx="24" fill="#fbfcfe" stroke="#e4e9f0"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="62" fill="#16324c" font-size="25" font-weight="650">System capabilities and skill permissions</text>
    <text x="64" y="92" fill="#64748b" font-size="15.5">A skill only sees the tools listed in its allowed_tools.</text>
    <g stroke="#9fb0c1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M396 257L404 265L396 273"/>
      <path d="M806 257L814 265L806 273"/>
    </g>
    <path d="M214 388V404" stroke="#cbbcf0" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M609 364V404" stroke="#e4a69d" stroke-width="2" stroke-dasharray="4 5"/>
    <g filter="url(#trShadow)">
      <g transform="translate(64 140)">
        <rect width="300" height="248" rx="18" fill="#ffffff" stroke="#e4e9f0"/>
        <text x="24" y="42" fill="#16324c" font-size="18" font-weight="700">System registry</text>
        <text x="24" y="64" fill="#8b98a9" font-size="12.5">capabilities of the app</text>
        <g transform="translate(20 84)">
          <rect width="260" height="40" rx="10" fill="#f2f6fa"/>
          <text x="16" y="25" fill="#33475c" font-size="13.5" font-family="'SF Mono', Consolas, monospace">list_documents</text>
          <rect x="198" y="9" width="46" height="22" rx="11" fill="#e5f6ec"/>
          <text x="221" y="24" fill="#1f7a4d" text-anchor="middle" font-size="10" font-weight="700">READ</text>
        </g>
        <g transform="translate(20 132)">
          <rect width="260" height="40" rx="10" fill="#f2f6fa"/>
          <text x="16" y="25" fill="#33475c" font-size="13.5" font-family="'SF Mono', Consolas, monospace">read_document</text>
          <rect x="198" y="9" width="46" height="22" rx="11" fill="#e5f6ec"/>
          <text x="221" y="24" fill="#1f7a4d" text-anchor="middle" font-size="10" font-weight="700">READ</text>
        </g>
        <g transform="translate(20 180)">
          <rect width="260" height="40" rx="10" fill="#fdf3e3"/>
          <text x="16" y="25" fill="#33475c" font-size="13.5" font-family="'SF Mono', Consolas, monospace">export_docx</text>
          <rect x="194" y="9" width="50" height="22" rx="11" fill="#f8e3c2"/>
          <text x="219" y="24" fill="#9a5410" text-anchor="middle" font-size="10" font-weight="700">WRITE</text>
        </g>
      </g>
      <g transform="translate(444 170)">
        <rect width="330" height="190" rx="18" fill="#eaf4fc" stroke="#a8d2ee"/>
        <text x="24" y="42" fill="#16324c" font-size="17" font-weight="700" font-family="'SF Mono', Consolas, monospace">allowed_tools</text>
        <text x="24" y="64" fill="#5b7590" font-size="12.5">the subset granted to a skill</text>
        <g transform="translate(22 82)">
          <rect width="286" height="42" rx="10" fill="#ffffff" stroke="#bcd9ee"/>
          <circle cx="21" cy="21" r="9" fill="#1d83c4"/>
          <path d="M17 21l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="26" fill="#33475c" font-size="13.5" font-family="'SF Mono', Consolas, monospace">read_document</text>
        </g>
        <g transform="translate(22 134)">
          <rect width="286" height="42" rx="10" fill="#ffffff" stroke="#bcd9ee"/>
          <circle cx="21" cy="21" r="9" fill="#1d83c4"/>
          <path d="M17 21l3 3 6-7" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="40" y="26" fill="#33475c" font-size="13.5" font-family="'SF Mono', Consolas, monospace">export_docx</text>
        </g>
      </g>
      <g transform="translate(854 182)">
        <rect width="282" height="166" rx="18" fill="#ffffff" stroke="#e4e9f0"/>
        <rect x="20" y="20" width="44" height="44" rx="12" fill="#e5f6ec"/>
        <path d="M32 43l7 7 14-15" fill="none" stroke="#2f855a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="20" y="102" fill="#16324c" font-size="17" font-weight="650">Skill run</text>
        <text x="20" y="126" fill="#8b98a9" font-size="12.5">sees only the granted tools</text>
      </g>
      <g transform="translate(64 404)">
        <rect width="330" height="48" rx="12" fill="#ffffff" stroke="#cbbcf0" stroke-dasharray="6 5"/>
        <text x="20" y="30" fill="#6d4fc4" font-size="13.5" font-weight="700">Plugin</text>
        <text x="76" y="30" fill="#64748b" font-size="12.5">tools &#183; checks &#183; formats</text>
        <rect x="256" y="13" width="58" height="22" rx="11" fill="#efeafb"/>
        <text x="285" y="28" fill="#6d4fc4" text-anchor="middle" font-size="9.5" font-weight="700">ROADMAP</text>
      </g>
      <g transform="translate(444 404)">
        <rect width="330" height="48" rx="12" fill="#fdecea" stroke="#f2c4bd"/>
        <circle cx="26" cy="24" r="10" fill="#c0392b"/>
        <path d="M22 20l8 8M30 20l-8 8" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
        <text x="46" y="29" fill="#8f2a1f" font-size="12.5">unknown tool &#8212; refused before the LLM call</text>
      </g>
    </g>
  </g>
</svg>
