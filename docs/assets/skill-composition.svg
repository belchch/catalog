<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Скилл как инструмент сессии</title>
  <desc id="desc">Подключённый к сессии скилл может вызвать другой скилл в пределах заданных ограничений.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#829ab1"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#f7fafc"/>
  <text x="60" y="62" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="650">Скиллы можно подключать к чату и вызывать друг из друга</text>
  <text x="60" y="92" fill="#627d98" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Каждый вызов получает отдельный прогон и остаётся видимым в трейсе.</text>
  <g fill="none" stroke="#829ab1" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M250 205H322"/>
    <path d="M535 205H607"/>
    <path d="M820 205H892"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(60 139)">
      <rect width="190" height="132" rx="20" fill="#ffffff" stroke="#d9e2ec"/>
      <path d="M28 28H66C72 28 76 32 76 38V57C76 63 72 67 66 67H48L36 78V67H28C22 67 18 63 18 57V38C18 32 22 28 28 28Z" fill="#e8f4fc" stroke="#1d83c4" stroke-width="2"/>
      <text x="22" y="101" fill="#102a43" font-size="18" font-weight="650">Сессия</text>
      <text x="92" y="48" fill="#627d98" font-size="13">Инструменты</text>
      <text x="92" y="67" fill="#1d83c4" font-size="13" font-weight="650">2 подключено</text>
    </g>
    <g transform="translate(322 139)">
      <rect width="213" height="132" rx="20" fill="#e8f4fc" stroke="#85c8ef" stroke-width="1.5"/>
      <rect x="22" y="22" width="44" height="44" rx="10" fill="#1d83c4"/>
      <path d="M35 44H53M44 35V53" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="22" y="96" fill="#102a43" font-size="18" font-weight="700">Скилл A</text>
      <text x="22" y="117" fill="#486581" font-size="13">pinned: 72ac…91ef</text>
    </g>
    <g transform="translate(607 139)">
      <rect width="213" height="132" rx="20" fill="#ffffff" stroke="#b8a3e8" stroke-width="1.5"/>
      <rect x="22" y="22" width="44" height="44" rx="10" fill="#805ad5"/>
      <path d="M32 44H56M44 32V56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="22" y="96" fill="#102a43" font-size="18" font-weight="700">Скилл B</text>
      <text x="22" y="117" fill="#627d98" font-size="13">вложенный прогон</text>
    </g>
    <g transform="translate(892 139)">
      <rect width="248" height="132" rx="20" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5"/>
      <circle cx="45" cy="45" r="23" fill="#e6ffed"/>
      <path d="M34 45L41 52L57 36" fill="none" stroke="#2f855a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="22" y="96" fill="#102a43" font-size="18" font-weight="650">Результат</text>
      <text x="22" y="117" fill="#627d98" font-size="13">в основном трейсе</text>
    </g>
  </g>
  <g transform="translate(60 321)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="1080" height="62" rx="16" fill="#ffffff" stroke="#d9e2ec"/>
    <text x="24" y="38" fill="#486581" font-size="14" font-weight="650">ОГРАНИЧЕНИЯ</text>
    <line x1="174" y1="16" x2="174" y2="46" stroke="#d9e2ec"/>
    <text x="204" y="38" fill="#102a43" font-size="15">глубина ≤ 2</text>
    <line x1="358" y1="16" x2="358" y2="46" stroke="#d9e2ec"/>
    <text x="388" y="38" fill="#102a43" font-size="15">до 60 LLM-вызовов</text>
    <line x1="603" y1="16" x2="603" y2="46" stroke="#d9e2ec"/>
    <text x="633" y="38" fill="#102a43" font-size="15">до 20 вложенных прогонов</text>
    <line x1="884" y1="16" x2="884" y2="46" stroke="#d9e2ec"/>
    <text x="914" y="38" fill="#102a43" font-size="15">общий дедлайн</text>
  </g>
</svg>
