<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Документный цикл Catalog</title>
  <desc id="desc">Catalog читает офисные документы, обрабатывает их как Markdown и выгружает результат обратно в Word с самопроверкой.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#829ab1"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2f855a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#102a43" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#f7fafc"/>
  <text x="60" y="62" fill="#102a43" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="650">Word на входе и на выходе</text>
  <text x="60" y="92" fill="#627d98" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Между ними — обработка в Markdown, ссылки на источники и проверяемый экспорт.</text>
  <g fill="none" stroke="#829ab1" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M250 232H311"/>
    <path d="M493 232H554"/>
    <path d="M754 232H815"/>
    <path d="M993 232H1046"/>
  </g>
  <path d="M1114 303V359H902V303" fill="none" stroke="#2f855a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <g transform="translate(60 145)">
      <rect width="190" height="174" rx="22" fill="#ffffff" stroke="#85c8ef" stroke-width="1.5"/>
      <rect x="20" y="22" width="47" height="54" rx="8" fill="#2b6cb0"/>
      <text x="43.5" y="57" fill="#ffffff" text-anchor="middle" font-size="20" font-weight="800">W</text>
      <text x="82" y="45" fill="#102a43" font-size="17" font-weight="700">Документы</text>
      <text x="82" y="67" fill="#627d98" font-size="12">на входе</text>
      <g transform="translate(20 102)">
        <rect width="48" height="25" rx="12.5" fill="#e8f4fc"/><text x="24" y="17" fill="#1d5f92" text-anchor="middle" font-size="10" font-weight="700">DOCX</text>
        <rect x="55" width="42" height="25" rx="12.5" fill="#e6ffed"/><text x="76" y="17" fill="#276749" text-anchor="middle" font-size="10" font-weight="700">XLSX</text>
        <rect x="104" width="38" height="25" rx="12.5" fill="#fff0f0"/><text x="123" y="17" fill="#9b2c2c" text-anchor="middle" font-size="10" font-weight="700">PDF</text>
      </g>
      <text x="20" y="154" fill="#627d98" font-size="12">CSV · Markdown</text>
    </g>
    <g transform="translate(311 166)">
      <rect width="182" height="132" rx="22" fill="#ffffff" stroke="#d9e2ec"/>
      <circle cx="43" cy="41" r="22" fill="#e3f8f4"/>
      <path d="M32 42H54M36 34H50M36 50H50" stroke="#147d83" stroke-width="2.5" stroke-linecap="round"/>
      <text x="22" y="91" fill="#102a43" font-size="17" font-weight="700">Извлечение</text>
      <text x="22" y="113" fill="#627d98" font-size="12">текст · таблицы · страницы</text>
    </g>
    <g transform="translate(554 145)">
      <rect width="200" height="174" rx="22" fill="#e8f4fc" stroke="#85c8ef" stroke-width="1.5"/>
      <rect x="21" y="22" width="48" height="48" rx="11" fill="#1d83c4"/>
      <path d="M34 46L42 54L58 37" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="43" fill="#102a43" font-size="17" font-weight="700">Скилл</text>
      <text x="84" y="64" fill="#486581" font-size="12">обработка</text>
      <rect x="20" y="96" width="160" height="49" rx="10" fill="#ffffff" stroke="#b6d9f2"/>
      <text x="32" y="117" fill="#243b53" font-size="13" font-weight="650">Markdown</text>
      <text x="32" y="136" fill="#805ad5" font-size="11">+ ссылки на источники</text>
    </g>
    <g transform="translate(815 145)">
      <rect width="178" height="174" rx="22" fill="#ffffff" stroke="#85c8ef" stroke-width="1.5"/>
      <rect x="20" y="22" width="47" height="54" rx="8" fill="#2b6cb0"/>
      <text x="43.5" y="57" fill="#ffffff" text-anchor="middle" font-size="20" font-weight="800">W</text>
      <text x="82" y="43" fill="#102a43" font-size="16" font-weight="700">DOCX</text>
      <text x="82" y="64" fill="#627d98" font-size="12">на выходе</text>
      <text x="20" y="111" fill="#486581" font-size="12">Шаблон заказчика</text>
      <text x="20" y="132" fill="#486581" font-size="12">Несколько документов</text>
      <text x="20" y="153" fill="#486581" font-size="12">Таблицы и заголовки</text>
    </g>
    <g transform="translate(1046 166)">
      <rect width="94" height="132" rx="22" fill="#ffffff" stroke="#9ae6b4" stroke-width="1.5"/>
      <circle cx="47" cy="42" r="24" fill="#e6ffed"/>
      <path d="M35 42L43 50L59 33" fill="none" stroke="#2f855a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="47" y="91" fill="#276749" text-anchor="middle" font-size="13" font-weight="700">Структура</text>
      <text x="47" y="110" fill="#627d98" text-anchor="middle" font-size="11">совпала</text>
    </g>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="915" y="345" width="199" height="30" rx="15" fill="#e6ffed"/>
    <text x="1014.5" y="365" fill="#276749" text-anchor="middle" font-size="12" font-weight="700">повторное чтение и сверка</text>
  </g>
</svg>
