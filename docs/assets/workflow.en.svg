  <rect x="0.5" y="0.5" width="1199" height="329" rx="24" fill="#fbfcfe" stroke="#e4e9f0"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="62" fill="#16324c" font-size="25" font-weight="650">From documents to a reusable process</text>
    <text x="64" y="92" fill="#64748b" font-size="15.5">The plan is refined in chat, saved as a skill, and applied to later documents.</text>
