<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">How Catalog works</title>
  <desc id="wfDesc">Documents go through discussion, draft, skill, apply, and checks to a finished result.</desc>
  <defs>
