<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="wsTitle wsDesc">
  <title id="wsTitle">Данные в рабочей папке</title>
  <desc id="wsDesc">Исходные документы, результаты и индекс живут в папке пользователя; результаты открываются в Obsidian.</desc>
  <defs>
    <filter id="wsShadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f2b46" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="489" rx="24" fill="#fbfcfe" stroke="#e4e9f0"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
    <text x="64" y="62" fill="#16324c" font-size="25" font-weight="650">Воркспейс — обычная папка пользователя</text>
    <text x="64" y="92" fill="#64748b" font-size="15.5">Файлы читаемы и без Catalog; SQLite — только пересоздаваемый индекс.</text>
    <g stroke="#9fb0c1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M783 237L791 245L783 253"/>
    </g>
    <line x1="764" y1="245" x2="778" y2="245" stroke="#c6d2de" stroke-width="2"/>
    <g filter="url(#wsShadow)">
      <path d="M64 172c0-9 7-16 16-16h172l24 24h472c9 0 16 7 16 16v228c0 9-7 16-16 16H80c-9 0-16-7-16-16z" fill="#ffffff" stroke="#dbe3ec"/>
      <text x="92" y="205" fill="#1d83c4" font-size="13" font-weight="700" letter-spacing="1.2">ПАПКА ПРОЕКТА</text>
      <g transform="translate(92 222)">
        <rect width="200" height="192" rx="14" fill="#f4f7fa"/>
        <text x="16" y="30" fill="#16324c" font-size="14.5" font-weight="650">Исходные документы</text>
        <g transform="translate(16 46)">
          <rect width="168" height="36" rx="9" fill="#ffffff"/>
          <rect x="12" y="11" width="14" height="14" rx="4" fill="#2b6cb0"/>
          <text x="36" y="23" fill="#4d637a" font-size="11.5">ТЗ на систему.docx</text>
        </g>
        <g transform="translate(16 90)">
          <rect width="168" height="36" rx="9" fill="#ffffff"/>
          <rect x="12" y="11" width="14" height="14" rx="4" fill="#c0392b"/>
          <text x="36" y="23" fill="#4d637a" font-size="11.5">Регламент.pdf</text>
        </g>
        <g transform="translate(16 134)">
          <rect width="168" height="36" rx="9" fill="#ffffff"/>
          <rect x="12" y="11" width="14" height="14" rx="4" fill="#2f855a"/>
          <text x="36" y="23" fill="#4d637a" font-size="11.5">Реестр рисков.xlsx</text>
        </g>
      </g>
      <g transform="translate(314 222)">
        <rect width="200" height="192" rx="14" fill="#eaf4fc"/>
        <text x="16" y="30" fill="#16324c" font-size="14.5" font-weight="650">results/</text>
        <g transform="translate(16 46)">
          <rect width="168" height="60" rx="9" fill="#ffffff" stroke="#cfe4f4"/>
          <text x="12" y="24" fill="#33475c" font-size="12.5" font-weight="650">Анализ требований.md</text>
          <text x="12" y="44" fill="#6d4fc4" font-size="11">[[ТЗ на систему]]</text>
        </g>
        <g transform="translate(16 116)">
          <rect width="168" height="60" rx="9" fill="#ffffff" stroke="#cfe4f4"/>
          <text x="12" y="24" fill="#33475c" font-size="12.5" font-weight="650">Сводка рисков.md</text>
          <text x="12" y="44" fill="#6d4fc4" font-size="11">[[Регламент]]</text>
        </g>
      </g>
      <g transform="translate(536 222)">
        <rect width="200" height="192" rx="14" fill="#f4f7fa"/>
        <text x="16" y="30" fill="#16324c" font-size="14.5" font-weight="650">.catalog/</text>
        <g transform="translate(16 46)">
          <rect width="168" height="44" rx="9" fill="#ffffff"/>
          <ellipse cx="30" cy="15" rx="10" ry="4.5" fill="#8fa3b8"/>
          <path d="M20 15v13c0 2.5 4.5 4.5 10 4.5s10-2 10-4.5V15" fill="#c2d0de"/>
          <text x="52" y="27" fill="#33475c" font-size="12.5" font-family="'SF Mono', Consolas, monospace">index.db</text>
        </g>
        <text x="16" y="122" fill="#8b98a9" font-size="12">пересоздаваемый индекс</text>
        <text x="16" y="141" fill="#8b98a9" font-size="12">и служебные данные</text>
      </g>
      <g transform="translate(810 170)">
        <rect width="326" height="150" rx="18" fill="#ffffff" stroke="#cbbcf0"/>
        <path d="M40 22l14-8 14 9-5 20-9 11-10-11z" fill="#6d4fc4"/>
        <circle cx="53" cy="31" r="5" fill="#ffffff" opacity="0.85"/>
        <text x="86" y="38" fill="#16324c" font-size="18" font-weight="700">Obsidian</text>
        <text x="86" y="60" fill="#8b98a9" font-size="12.5">те же файлы, граф связей</text>
        <g>
          <path d="M46 112l56-14M112 98l52 16M174 114l58-16M108 100l122-4" stroke="#cbbcf0" stroke-width="1.8"/>
          <circle cx="40" cy="113" r="5" fill="#6d4fc4"/>
          <circle cx="106" cy="97" r="5" fill="#6d4fc4"/>
          <circle cx="168" cy="115" r="5" fill="#6d4fc4"/>
          <circle cx="236" cy="96" r="5" fill="#6d4fc4"/>
          <circle cx="290" cy="112" r="5" fill="#6d4fc4"/>
          <path d="M241 98l44 12" stroke="#cbbcf0" stroke-width="1.8"/>
