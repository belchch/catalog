      <g transform="translate(810 352)">
        <rect width="326" height="88" rx="16" fill="#fdf3e3" stroke="#f0d5a8"/>
        <text x="22" y="32" fill="#8a5310" font-size="13.5" font-weight="700">Внешний LLM API</text>
        <text x="22" y="54" fill="#946227" font-size="12">получает текст документов только</text>
        <text x="22" y="72" fill="#946227" font-size="12">в момент выполнения операции</text>
      </g>
